<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nutrify — Know What You Eat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#1c2128;
  --s0:#21262d;--s1:#30363d;--s2:#3d444d;
  --bd:#30363d;--bd2:#3d444d;
  --tx:#e6edf3;--tx2:#b1bac4;--tx3:#8b949e;
  --ac:#3fb950;--ac2:#56d364;
  --warn:#d29922;--danger:#f85149;--info:#58a6ff;
  --r:12px;--r2:8px;--r3:6px;
  --ff:'Inter',sans-serif;--ffd:'Playfair Display',serif;
  --sh:0 1px 3px rgba(0,0,0,.4),0 4px 20px rgba(0,0,0,.25);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--ff);background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--s2);border-radius:4px}
.hidden{display:none!important}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}

/* LAYOUT */
.app{display:flex;min-height:100vh}
.sidebar{width:220px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:30}
.main{flex:1;min-width:0;overflow-x:hidden}

/* SIDEBAR */
.logo-area{padding:20px 16px 16px;border-bottom:1px solid var(--bd)}
.logo-row{display:flex;align-items:center;gap:9px}
.logo-gem{width:32px;height:32px;background:linear-gradient(135deg,var(--ac),var(--ac2));border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 2px 8px rgba(63,185,80,.3)}
.logo-name{font-family:var(--ffd);font-size:19px;color:var(--tx);font-weight:700}
.logo-ver{font-size:9px;color:var(--tx3);letter-spacing:.08em;text-transform:uppercase}
.nav-area{padding:10px 8px;flex:1}
.nav-lbl{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);padding:8px 10px 4px;font-weight:600}
.nb{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:var(--r3);cursor:pointer;color:var(--tx3);font-size:13px;border:none;background:none;width:100%;text-align:left;transition:all .12s;position:relative;font-family:var(--ff)}
.nb:hover{background:var(--s0);color:var(--tx)}
.nb.on{background:rgba(63,185,80,.1);color:var(--ac);font-weight:500}
.nb.on::before{content:'';position:absolute;left:0;top:20%;height:60%;width:2px;background:var(--ac);border-radius:2px}
.nb svg{width:15px;height:15px;flex-shrink:0;opacity:.6;transition:opacity .12s}
.nb:hover svg,.nb.on svg{opacity:1}
.sidebar-foot{padding:12px;border-top:1px solid var(--bd)}
.user-row{display:flex;align-items:center;gap:9px;padding:8px 10px;background:var(--s0);border-radius:var(--r3);cursor:pointer;border:1px solid var(--bd);transition:all .12s}
.user-row:hover{border-color:var(--bd2)}
.uav{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#166534,#22c55e);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.uname{font-size:12px;font-weight:500;color:var(--tx)}
.umeta{font-size:10px;color:var(--tx3)}

/* PAGE HEADER */
.ph{padding:20px 24px 16px;border-bottom:1px solid var(--bd);background:var(--bg);position:sticky;top:0;z-index:20}
.ph-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph-title{font-family:var(--ffd);font-size:24px;color:var(--tx);font-weight:700;letter-spacing:-.3px}
.ph-sub{font-size:12px;color:var(--tx3);margin-top:2px}
.date-ctrl{display:flex;align-items:center;gap:6px}
.dc-btn{background:var(--s0);border:1px solid var(--bd);color:var(--tx3);border-radius:var(--r3);padding:5px 11px;cursor:pointer;font-size:14px;font-family:var(--ff);transition:all .12s}
.dc-btn:hover{border-color:var(--bd2);color:var(--tx)}
.dc-cur{font-size:12px;font-weight:500;color:var(--tx2);min-width:110px;text-align:center}

/* CONTENT */
.content{padding:20px 24px 48px;max-width:1080px}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:18px;transition:border-color .12s}
.card:hover{border-color:var(--bd2)}
.card-sm{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:14px}
.ct{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--tx3);margin-bottom:14px;font-weight:600}
.sg{height:14px}
.dv{height:1px;background:var(--bd);margin:16px 0}

/* GRIDS */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.gcol{display:flex;flex-direction:column;gap:14px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 15px;border-radius:var(--r3);font-size:13px;font-weight:500;cursor:pointer;transition:all .12s;border:1px solid transparent;font-family:var(--ff);white-space:nowrap}
.btn-p{background:var(--ac);color:#0d1117;border-color:var(--ac)}
.btn-p:hover{background:var(--ac2);transform:translateY(-1px);box-shadow:0 3px 12px rgba(63,185,80,.3)}
.btn-g{background:transparent;color:var(--tx3);border-color:var(--bd)}
.btn-g:hover{background:var(--s0);color:var(--tx);border-color:var(--bd2)}
.btn-d{background:transparent;color:var(--danger);border-color:rgba(248,81,73,.3)}
.btn-d:hover{background:rgba(248,81,73,.08)}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-full{width:100%}

/* INPUTS */
input,select,textarea{font-family:var(--ff);font-size:13px;background:var(--bg3);border:1px solid var(--bd);color:var(--tx);border-radius:var(--r3);padding:8px 12px;width:100%;outline:none;transition:border-color .12s,box-shadow .12s}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(63,185,80,.1)}
input::placeholder{color:var(--tx3)}
select option{background:var(--bg3)}
textarea{resize:vertical;min-height:72px}
.lbl{font-size:11px;color:var(--tx3);display:block;margin-bottom:5px;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.fg{margin-bottom:14px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* HEIGHT UNIT TOGGLE */
.ht-toggle{display:flex;background:var(--bg3);border:1px solid var(--bd);border-radius:var(--r3);overflow:hidden;width:fit-content;margin-bottom:8px}
.ht-opt{padding:5px 16px;font-size:11px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--tx3);font-family:var(--ff);transition:all .12s;text-transform:uppercase;letter-spacing:.06em}
.ht-opt.on{background:var(--ac);color:#0d1117}
.ht-ftrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.ht-hint{font-size:10px;color:var(--tx3);margin-top:5px;line-height:1.4}

/* PROGRESS */
.pb-wrap{height:5px;background:var(--s0);border-radius:3px;overflow:hidden}
.pb{height:100%;border-radius:3px;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* BADGES */
.badge{display:inline-flex;align-items:center;font-size:10px;font-weight:500;padding:2px 8px;border-radius:20px}
.bg-g{background:rgba(63,185,80,.12);color:#56d364;border:1px solid rgba(63,185,80,.2)}
.bg-a{background:rgba(210,153,34,.12);color:#d29922;border:1px solid rgba(210,153,34,.2)}
.bg-r{background:rgba(248,81,73,.1);color:#ff7b72;border:1px solid rgba(248,81,73,.2)}
.bg-b{background:rgba(88,166,255,.1);color:#79c0ff;border:1px solid rgba(88,166,255,.2)}

/* ALERTS */
.alert{border-radius:var(--r3);padding:9px 13px;font-size:12px;display:flex;align-items:flex-start;gap:8px;border:1px solid transparent;line-height:1.5;margin-top:8px}
.al-w{background:rgba(210,153,34,.08);border-color:rgba(210,153,34,.25);color:#ffa657}
.al-ok{background:rgba(63,185,80,.08);border-color:rgba(63,185,80,.2);color:#56d364}
.al-d{background:rgba(248,81,73,.08);border-color:rgba(248,81,73,.2);color:#ff7b72}
.al-i{background:rgba(88,166,255,.08);border-color:rgba(88,166,255,.2);color:#79c0ff}

/* TABS */
.tabs{display:flex;gap:2px;background:var(--bg3);border:1px solid var(--bd);padding:3px;border-radius:var(--r3);margin-bottom:18px}
.tab{flex:1;padding:6px 8px;font-size:12px;font-weight:500;text-align:center;border-radius:5px;cursor:pointer;color:var(--tx3);border:none;background:transparent;font-family:var(--ff);transition:all .12s}
.tab.on{background:var(--s1);color:var(--tx);border:1px solid var(--bd2)}

/* RING */
.ring-wrap{position:relative;width:110px;height:110px;margin:0 auto}
.ring-svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--s1);stroke-width:9}
.ring-fg{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .7s cubic-bezier(.4,0,.2,1)}
.ring-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-num{font-family:var(--ffd);font-size:20px;color:var(--tx);line-height:1;font-weight:700}
.ring-lbl{font-size:9px;color:var(--tx3);letter-spacing:.05em;text-transform:uppercase}

/* DATA ROWS */
.lv-row{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid var(--bd)}
.lv-row:last-child{border-bottom:none}
.lv-row span:first-child{color:var(--tx3)}
.lv-row span:last-child{font-weight:500;color:var(--tx)}
.lv-warn{color:var(--warn)!important}
.lv-danger{color:var(--danger)!important}
.lv-ok{color:var(--ac)!important}

/* MACRO ROW */
.macro-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.macro-row:last-child{margin-bottom:0}
.mr-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.mr-name{font-size:12px;color:var(--tx3);width:56px;flex-shrink:0}
.mr-bar{flex:1}
.mr-val{font-size:12px;font-weight:500;color:var(--tx);min-width:80px;text-align:right}

/* FIBER */
.fiber-stack{display:flex;height:7px;border-radius:4px;overflow:hidden;gap:1px}
.fs-sol{background:var(--ac)}
.fs-ins{background:var(--warn)}
.fs-rem{background:var(--s1)}

/* STAT TILE */
.stile{background:var(--bg3);border:1px solid var(--bd);border-radius:var(--r3);padding:14px;text-align:center}
.st-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--tx3);margin-bottom:5px;font-weight:600}
.st-val{font-family:var(--ffd);font-size:24px;color:var(--tx);line-height:1;font-weight:700}
.st-unit{font-size:10px;color:var(--tx3);margin-top:2px}

/* NUTRIENT ROW */
.nrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd);transition:background .1s}
.nrow:last-child{border-bottom:none}
.nrow:hover{background:rgba(255,255,255,.02);border-radius:6px;padding-left:4px;padding-right:4px;margin:0 -4px}
.nr-ic{width:18px;text-align:center;font-size:12px;flex-shrink:0}
.nr-info{flex:1;min-width:0}
.nr-name{font-size:12px;font-weight:500;color:var(--tx)}
.nr-sub{font-size:10px;color:var(--tx3)}
.nr-bar{flex:1;min-width:80px}
.nr-vals{font-size:11px;color:var(--tx3);min-width:120px;text-align:right;white-space:nowrap}
.nr-vals b{color:var(--tx);font-weight:600}
.wtag{font-size:9px;background:rgba(163,113,247,.15);color:#c9a9ff;border:1px solid rgba(163,113,247,.2);padding:1px 6px;border-radius:10px;margin-left:5px;vertical-align:middle}

/* MEAL ENTRY */
.meal-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg3);border:1px solid var(--bd);border-radius:var(--r3);margin-bottom:6px;transition:border-color .12s}
.meal-row:hover{border-color:var(--bd2)}
.meal-em{width:36px;height:36px;border-radius:8px;background:var(--s0);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.meal-info{flex:1;min-width:0}
.meal-name{font-size:13px;font-weight:500;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meal-meta{font-size:10px;color:var(--tx3);margin-top:1px}
.meal-kcal{text-align:right;flex-shrink:0}
.meal-kv{font-size:14px;font-weight:600;color:var(--ac);line-height:1.2}
.meal-ku{font-size:9px;color:var(--tx3)}
.del-btn{background:none;border:none;color:var(--tx3);cursor:pointer;padding:5px;border-radius:5px;font-size:12px;transition:all .12s;flex-shrink:0}
.del-btn:hover{color:var(--danger);background:rgba(248,81,73,.1)}

/* CHAT */
.chat-outer{display:flex;flex-direction:column;height:calc(100vh - 210px);min-height:380px}
.chat-msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--bg3);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:10px}
.cmsg{display:flex;gap:8px;align-items:flex-start;animation:fadeUp .18s ease}
.cmsg.user{flex-direction:row-reverse}
.cav{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.cav-b{background:rgba(63,185,80,.2);color:var(--ac);border:1px solid rgba(63,185,80,.3)}
.cav-u{background:var(--s1);color:var(--tx3);border:1px solid var(--bd2)}
.cbub{max-width:76%;padding:9px 13px;border-radius:11px;font-size:13px;line-height:1.55}
.cbub-b{background:var(--s0);border:1px solid var(--bd);color:var(--tx);border-top-left-radius:3px}
.cbub-u{background:rgba(63,185,80,.12);border:1px solid rgba(63,185,80,.2);color:var(--tx);border-top-right-radius:3px}
.chat-inp-row{display:flex;gap:8px}
.chat-inp-row input{flex:1}
.tdot{display:inline-block;width:5px;height:5px;background:var(--tx3);border-radius:50%;animation:blink 1.2s infinite;margin:0 1px}
.tdot:nth-child(2){animation-delay:.2s}
.tdot:nth-child(3){animation-delay:.4s}

/* WEEK CHART */
.wchart{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;align-items:end;height:80px;margin-top:8px}
.wbar-col{display:flex;flex-direction:column;align-items:center;gap:3px}
.wbar{width:100%;border-radius:3px 3px 0 0;min-height:3px;cursor:pointer;position:relative;transition:opacity .12s}
.wbar:hover{opacity:.8}
.wbar:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100%+5px);left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--bd2);color:var(--tx);font-size:11px;padding:4px 9px;border-radius:6px;white-space:nowrap;z-index:10;font-family:var(--ff);pointer-events:none}
.wday{font-size:9px;color:var(--tx3)}
.wkcal{font-size:9px;color:var(--tx3)}

/* SCAN ZONE */
.scan-zone{border:1.5px dashed var(--bd2);border-radius:var(--r);padding:28px 20px;text-align:center;cursor:pointer;transition:all .15s;background:var(--bg3)}
.scan-zone:hover{border-color:var(--ac);background:rgba(63,185,80,.04)}
.sz-ic{font-size:34px;display:block;margin-bottom:8px}
.sz-title{font-size:14px;font-weight:500;color:var(--tx)}
.sz-sub{font-size:11px;color:var(--tx3);margin-top:5px;line-height:1.5}

/* BMI */
.bmi-bar{height:10px;border-radius:5px;background:linear-gradient(to right,#3b82f6,#22c55e 30%,#22c55e 52%,#f59e0b 68%,#ef4444 86%);position:relative;margin:10px 0}
.bmi-ptr{position:absolute;top:-5px;width:4px;height:20px;background:white;border-radius:2px;transform:translateX(-50%);transition:left .5s;box-shadow:0 0 0 2px rgba(0,0,0,.4)}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}
.modal{background:var(--bg2);border:1px solid var(--bd2);border-radius:var(--r);width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--bd)}
.modal-ttl{font-family:var(--ffd);font-size:18px;color:var(--tx);font-weight:700}
.modal-body{padding:20px}
.x-btn{background:none;border:none;color:var(--tx3);cursor:pointer;padding:4px;border-radius:5px;font-size:17px;line-height:1;transition:all .12s;font-family:var(--ff)}
.x-btn:hover{color:var(--tx);background:var(--s1)}

/* CHIPS */
.chip-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{padding:5px 12px;border-radius:20px;font-size:11px;background:var(--bg3);border:1px solid var(--bd);color:var(--tx3);cursor:pointer;transition:all .12s;font-family:var(--ff)}
.chip.on{background:rgba(63,185,80,.1);border-color:rgba(63,185,80,.3);color:var(--ac)}
.chip:hover{border-color:var(--bd2);color:var(--tx)}

/* HYDRATION */
.cups-row{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.cup{font-size:20px;cursor:pointer;transition:transform .1s;line-height:1}
.cup:hover{transform:scale(1.12)}

/* SEARCH DROPDOWN */
.search-dd{position:absolute;top:100%;left:0;right:0;background:var(--bg2);border:1px solid var(--bd2);border-radius:var(--r3);z-index:50;max-height:240px;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.sdd-item{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--bd);transition:background .1s}
.sdd-item:last-child{border-bottom:none}
.sdd-item:hover{background:var(--s0)}
.sdd-em{font-size:16px;flex-shrink:0}
.sdd-name{font-size:12px;font-weight:500;color:var(--tx)}
.sdd-meta{font-size:10px;color:var(--tx3)}
.sdd-kcal{font-size:12px;color:var(--ac);font-weight:600;flex-shrink:0}

/* ONBOARDING */
.ob-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
.ob-card{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:36px 32px;width:100%;max-width:460px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.ob-logo{font-family:var(--ffd);font-size:28px;color:var(--ac);margin-bottom:4px;font-weight:700}
.ob-sub{font-size:13px;color:var(--tx3);margin-bottom:24px}
.ob-dots{display:flex;gap:5px;margin-bottom:22px;align-items:center}
.od{width:6px;height:6px;border-radius:50%;background:var(--bd);transition:all .2s}
.od.cur{background:var(--ac);width:18px;border-radius:3px}
.od.done{background:rgba(63,185,80,.5)}
.ob-stitle{font-family:var(--ffd);font-size:20px;color:var(--tx);margin-bottom:4px;font-weight:700}
.ob-sdesc{font-size:13px;color:var(--tx3);margin-bottom:18px;line-height:1.5}
.ob-nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px}

/* QUICK FOODS */
.qf-grid{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.qf-chip{display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:11px;background:var(--bg3);border:1px solid var(--bd);color:var(--tx3);cursor:pointer;transition:all .12s;font-family:var(--ff)}
.qf-chip:hover,.qf-chip.on{background:rgba(63,185,80,.1);border-color:rgba(63,185,80,.3);color:var(--ac)}

/* MOBILE TOP BAR */
.mob-bar{display:none;position:sticky;top:0;z-index:40;background:var(--bg2);border-bottom:1px solid var(--bd);padding:10px 16px;align-items:center;justify-content:space-between}
.mob-menu{background:none;border:none;cursor:pointer;color:var(--tx);padding:4px;line-height:1}
.mob-logo{font-family:var(--ffd);font-size:18px;color:var(--ac);font-weight:700}

/* ING ROW */
.ing-row{display:grid;grid-template-columns:1fr 110px 32px;gap:8px;align-items:end;margin-bottom:8px}

/* FOOD PREVIEW */
.food-preview{background:var(--bg3);border:1px solid var(--bd2);border-radius:var(--r3);padding:14px;margin-bottom:12px}

/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.fade-in{animation:fadeUp .25s ease both}

/* MOBILE */
@media(max-width:860px){
  .sidebar{position:fixed;left:-240px;top:0;height:100vh;z-index:50;transition:left .25s;width:220px}
  .sidebar.open{left:0}
  .mob-bar{display:flex}
  .g4{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr 1fr}
  .content{padding:14px 16px 40px}
  .ph{padding:14px 16px}
}
@media(max-width:580px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  .frow{grid-template-columns:1fr}
  .ob-card{padding:24px 20px}
}
</style>

<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Nutrify — Dashboard</title>
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <!-- Google Fonts & Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
  <!-- Tailwind Configuration -->
  <script src="theme.js"></script>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col pb-20 md:pb-0 font-display">

  <!-- Header -->
  <header class="bg-surface/80 backdrop-blur-md sticky top-0 z-40 w-full border-b border-outline-variant/30 gradient-border !border-0 !rounded-none !border-b">
    <div class="flex justify-between items-center px-container-margin py-stack-sm w-full max-w-7xl mx-auto">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl overflow-hidden bg-white border border-outline-variant/20 flex-shrink-0 flex items-center justify-center">
          <img src="logo.png" alt="Logo" class="w-full h-full object-cover">
        </div>
        <h1 class="text-headline-md font-display font-extrabold text-primary">Nutrify</h1>
      </div>
      <div class="flex items-center gap-2">
        <button id="noti-btn" class="material-symbols-outlined text-primary hover:bg-primary/5 p-2 rounded-full transition-colors active:scale-95">
          notifications
        </button>
        <a href="profile.html" class="w-9 h-9 rounded-full overflow-hidden bg-surface-variant flex-shrink-0 border border-primary/20 active:scale-95 transition-transform">
          <img id="header-avatar" alt="User Avatar" class="w-full h-full object-cover" src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&q=80&w=200">
        </a>
      </div>
    </div>
  </header>

  <div class="flex-grow w-full max-w-7xl mx-auto flex">
    <!-- Desktop Side Navigation Bar (Dashboard Active) -->
    <nav class="hidden md:flex flex-col gap-6 bg-surface-container-lowest p-6 w-64 flex-shrink-0 min-h-[calc(100vh-64px)] gradient-border !border-0 !border-r !rounded-none mt-2">
      <div class="flex flex-col gap-2">
        <a href="dashboard.html" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left text-primary bg-secondary-container/20 md:bg-secondary-container/30 transition-all duration-150">
          <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1">dashboard</span>
          <span class="font-semibold text-body-md">Dashboard</span>
        </a>
        <a href="meal-log.html" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left text-on-surface-variant hover:bg-surface-variant/20 hover:text-primary transition-all duration-150">
          <span class="material-symbols-outlined">add_circle</span>
          <span class="font-semibold text-body-md">Meal Log</span>
        </a>
        <a href="ai-assistant.html" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left text-on-surface-variant hover:bg-surface-variant/20 hover:text-primary transition-all duration-150">
          <span class="material-symbols-outlined">chat</span>
          <span class="font-semibold text-body-md">Nutify Guide</span>
        </a>
        <a href="analytics.html" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left text-on-surface-variant hover:bg-surface-variant/20 hover:text-primary transition-all duration-150">
          <span class="material-symbols-outlined">monitoring</span>
          <span class="font-semibold text-body-md">Analytics</span>
        </a>
        <a href="profile.html" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left text-on-surface-variant hover:bg-surface-variant/20 hover:text-primary transition-all duration-150">
          <span class="material-symbols-outlined">person</span>
          <span class="font-semibold text-body-md">Profile & Goals</span>
        </a>
      </div>
    </nav>

    <!-- Content Area -->
    <main class="flex-grow p-4 md:p-8 max-w-5xl overflow-x-hidden">
      <div id="dashboard-content" class="fade-in">
        <!-- Dashboard populated by dashboard.js -->
      </div>
    </main>
  </div>

  <!-- Mobile Bottom Navigation Bar (Dashboard Active) -->
  <nav class="md:hidden fixed bottom-0 left-0 w-full z-40 bg-surface-container-lowest border-t border-outline-variant/30 shadow-lg px-2 pb-4 pt-2 flex justify-around items-center gradient-border !border-0 !border-t !rounded-t-3xl !rounded-b-none">
    <a href="dashboard.html" class="flex flex-col items-center justify-center text-primary bg-secondary-container/20 px-3 py-1 rounded-full transition-all">
      <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1">dashboard</span>
      <span class="text-xs mt-0.5">Dashboard</span>
    </a>
    <a href="meal-log.html" class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary px-3 py-1 transition-all">
      <span class="material-symbols-outlined">add_circle</span>
      <span class="text-xs mt-0.5">Meal Log</span>
    </a>
    <a href="ai-assistant.html" class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary px-3 py-1 transition-all">
      <span class="material-symbols-outlined">chat</span>
      <span class="text-xs mt-0.5">Guide</span>
    </a>
    <a href="analytics.html" class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary px-3 py-1 transition-all">
      <span class="material-symbols-outlined">monitoring</span>
      <span class="text-xs mt-0.5">Analytics</span>
    </a>
    <a href="profile.html" class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary px-3 py-1 transition-all">
      <span class="material-symbols-outlined">person</span>
      <span class="text-xs mt-0.5">Profile</span>
    </a>
  </nav>

  <!-- JS Controllers -->
  <script src="dashboard.js"></script>
</body>
</html>

<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Nutrify — Setup Profile</title>
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <!-- Google Fonts & Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white border border-outline-variant/30 rounded-2xl p-8 custom-shadow fade-in">
    <div class="flex items-center gap-3 mb-2 justify-center">
      <div class="w-10 h-10 rounded-xl overflow-hidden bg-white border border-outline-variant/20 flex-shrink-0 flex items-center justify-center">
        <img src="logo.png" alt="Logo" class="w-full h-full object-cover">
      </div>
      <h2 class="text-display font-display font-extrabold text-primary text-3xl leading-none">Nutrify</h2>
    </div>
    <p class="text-center text-body-md text-on-surface-variant mb-6">Let's set up your personalized target goals.</p>
    
    <form id="onboarding-form" class="space-y-4">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-outline uppercase tracking-wider mb-1">Gender</label>
          <select id="gender" class="w-full border border-outline-variant/30 rounded-xl px-3 py-2 bg-surface focus:ring-2 focus:ring-primary focus:border-transparent outline-none">
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-outline uppercase tracking-wider mb-1">Age (years)</label>
          <input type="number" id="age" required min="10" max="120" placeholder="e.g. 28" 
            class="w-full border border-outline-variant/30 rounded-xl px-3 py-2 bg-surface focus:ring-2 focus:ring-primary focus:border-transparent outline-none">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-outline uppercase tracking-wider mb-1">Height</label>
        <div class="flex gap-2 mb-2">
          <button type="button" class="unit-toggle-height px-3 py-1 text-xs font-semibold rounded-lg bg-primary text-white" data-unit="cm">Metric (cm)</button>
          <button type="button" class="unit-toggle-height px-3 py-1 text-xs font-semibold rounded-lg bg-surface border border-outline-variant/30" data-unit="ft">Imperial (ft/in)</button>
        </div>
        <div id="height-inputs-container">
          <!-- height inputs dynamic -->
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-outline uppercase tracking-wider mb-1">Weight</label>
        <div class="flex gap-2 mb-2">
          <button type="button" class="unit-toggle-weight px-3 py-1 text-xs font-semibold rounded-lg bg-primary text-white" data-unit="kg">Metric (kg)</button>
          <button type="button" class="unit-toggle-weight px-3 py-1 text-xs font-semibold rounded-lg bg-surface border border-outline-variant/30" data-unit="lbs">Imperial (lbs)</button>
        </div>
        <input type="number" id="weight" step="0.1" required min="20" placeholder="e.g. 75"
          class="w-full border border-outline-variant/30 rounded-xl px-3 py-2 bg-surface focus:ring-2 focus:ring-primary focus:border-transparent outline-none">
      </div>

      <div>
        <label class="block text-xs font-bold text-outline uppercase tracking-wider mb-1">Activity Level</label>
        <select id="activity" class="w-full border border-outline-variant/30 rounded-xl px-3 py-2 bg-surface focus:ring-2 focus:ring-primary focus:border-transparent outline-none">
          <option value="sedentary">Sedentary (desk job)</option>
          <option value="light">Lightly active (exercise 1-2 days/wk)</option>
          <option value="moderate" selected>Moderately active (exercise 3-5 days/wk)</option>
          <option value="active">Very active (heavy exercise daily)</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-bold text-outline uppercase tracking-wider mb-1">Primary Goal</label>
        <select id="goal" class="w-full border border-outline-variant/30 rounded-xl px-3 py-2 bg-surface focus:ring-2 focus:ring-primary focus:border-transparent outline-none">
          <option value="lose">Lose Weight (Deficit)</option>
          <option value="maintain" selected>Maintain Weight</option>
          <option value="gain">Build Muscle (Surplus)</option>
        </select>
      </div>

      <button type="submit" class="w-full bg-primary hover:bg-on-primary-container text-white py-3 rounded-xl font-bold transition-colors shadow-md flex items-center justify-center gap-2 mt-4">
        Calculate Targets
        <span class="material-symbols-outlined text-sm">arrow_forward</span>
      </button>
    </form>
  </div>

  <script src="calculator.js"></script>
  <script src="onboarding.js"></script>
</body>
</html>

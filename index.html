<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nutrify</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
    }
    .logo-pulse {
      animation: pulse-ring 2.5s cubic-bezier(0.215, 0.610, 0.355, 1) infinite;
    }
    @keyframes pulse-ring {
      0% {
        transform: scale(0.95);
        opacity: 0.8;
      }
      50% {
        transform: scale(1.05);
        opacity: 1;
      }
      100% {
        transform: scale(0.95);
        opacity: 0.8;
      }
    }
    .fade-out {
      animation: fadeOut 0.8s forwards;
    }
    @keyframes fadeOut {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }
    .logo-explode {
      animation: explode 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes explode {
      to {
        transform: scale(3);
        opacity: 0;
      }
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden bg-black flex flex-col items-center justify-center relative text-white">

  <!-- Front Video -->
  <video id="front-video" autoplay playsinline class="absolute inset-0 w-full h-full object-cover z-50">
    <source src="intro.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <!-- Fallback Content Container (behind video) -->
  <div id="splash-content" class="relative z-20 flex flex-col items-center justify-center gap-8 h-full py-16 px-6 text-center select-none">
    <div class="flex flex-col items-center gap-6">
      <div class="w-24 h-24 bg-white rounded-3xl overflow-hidden shadow-[0_0_40px_rgba(16,185,129,0.4)] border border-white/20 flex items-center justify-center">
        <img src="logo.png" alt="Nutrify Logo" class="w-full h-full object-cover">
      </div>
      <div class="space-y-2">
        <h1 class="text-5xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-100 to-emerald-300">
          Nutrify
        </h1>
        <p class="text-slate-300 text-sm max-w-xs leading-relaxed">
          Know what you eat. track calories, log meals, and consult your smart AI guide.
        </p>
      </div>
    </div>
  </div>

  <script>
    // Immediate redirect if profile already exists on this device
    if (localStorage.getItem('nutrify_profile')) {
      window.location.replace('dashboard.html');
    }

    const video = document.getElementById('front-video');

    // Autoplay with sound might be blocked by browsers until user interacts.
    // If user clicks anywhere, try to play if it was paused.
    document.addEventListener('click', () => {
      if (video.paused) {
        video.play().catch(e => console.log('Audio play blocked: ', e));
      }
    });

    // When the intro video ends, move to the next screen.
    video.addEventListener('ended', () => {
      const profile = localStorage.getItem('nutrify_profile');
      if (profile) {
        window.location.href = 'dashboard.html';
      } else {
        window.location.href = 'login.html';
      }
    });
  </script>
</body>
</html>

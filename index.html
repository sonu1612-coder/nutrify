<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nutrify</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
    }
    .logo-pulse {
      animation: pulse-ring 2.5s cubic-bezier(0.215, 0.610, 0.355, 1) infinite;
    }
    @keyframes pulse-ring {
      0% {
        transform: scale(0.95);
        opacity: 0.8;
      }
      50% {
        transform: scale(1.05);
        opacity: 1;
      }
      100% {
        transform: scale(0.95);
        opacity: 0.8;
      }
    }
    .fade-out {
      animation: fadeOut 0.8s forwards;
    }
    @keyframes fadeOut {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }
    .logo-explode {
      animation: explode 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes explode {
      to {
        transform: scale(3);
        opacity: 0;
      }
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden bg-black flex flex-col relative text-white">

  <!-- Front Video Section (Top) -->
  <div class="flex-grow relative overflow-hidden flex items-center justify-center bg-black">
    <video id="front-video" autoplay playsinline class="w-full h-full object-cover">
      <source src="intro.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>

  <!-- Options Container (Bottom) -->
  <div class="w-full bg-black flex flex-col items-center gap-6 py-8 px-6 z-10 border-t border-primary/20 shadow-[0_-10px_30px_rgba(0,168,107,0.15)] rounded-t-[2rem]">
    <div class="flex flex-col items-center gap-2 text-center">
      <h1 class="text-4xl font-extrabold tracking-tight bg-clip-text text-transparent bg-btn-gradient drop-shadow-lg">
        Nutrify
      </h1>
      <p class="text-gray-400 text-sm max-w-xs leading-relaxed font-light">
        Know what you eat. Track calories, log meals, and consult your smart AI guide.
      </p>
    </div>
    
    <div class="flex gap-4 w-full max-w-md">
      <a href="login.html" class="flex-1 py-4 text-center rounded-xl bg-gray-900 text-white font-bold hover:bg-gray-800 transition-colors border border-primary/30">Login</a>
      <a href="signup.html" class="flex-1 py-4 text-center rounded-xl bg-btn-gradient text-black font-bold hover:glow-emerald transition-all shadow-[0_0_20px_rgba(0,168,107,0.3)]">Get Started</a>
    </div>
  </div>

  <script>
    const video = document.getElementById('front-video');

    // Autoplay with sound might be blocked by browsers until user interacts.
    // If user clicks anywhere, try to play if it was paused.
    document.addEventListener('click', () => {
      if (video.paused) {
        video.play().catch(e => console.log('Audio play blocked: ', e));
      }
    });
  </script>
</body>
</html>

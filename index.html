<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nutrify</title>
  <script>
    (function() {
      const profile = localStorage.getItem('nutrify_profile');
      if (profile) {
        window.location.replace('dashboard.html');
      } else {
        window.location.replace('onboarding.html');
      }
    })();
  </script>
</head>
<body style="background-color: #f8f9ff;">
  <p style="text-align:center; padding-top: 80px; font-family: system-ui, -apple-system, sans-serif; color: #006e2f; font-weight: 600;">Redirecting to Nutrify...</p>
</body>
</html>

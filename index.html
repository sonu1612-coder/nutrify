<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nutrify</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <style>
    body {
      font-family: 'Outfit', sans-serif;
    }
    .logo-pulse {
      animation: pulse-ring 2.5s cubic-bezier(0.215, 0.610, 0.355, 1) infinite;
    }
    @keyframes pulse-ring {
      0% {
        transform: scale(0.95);
        opacity: 0.8;
      }
      50% {
        transform: scale(1.05);
        opacity: 1;
      }
      100% {
        transform: scale(0.95);
        opacity: 0.8;
      }
    }
    .fade-out {
      animation: fadeOut 0.8s forwards;
    }
    @keyframes fadeOut {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }
    .logo-explode {
      animation: explode 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes explode {
      to {
        transform: scale(3);
        opacity: 0;
      }
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden bg-black text-white relative">
  <!-- Front Video Section (Full Screen) -->
  <div id="video-container" class="absolute inset-0 flex items-center justify-center bg-black z-20 transition-opacity duration-1000">
    <video id="front-video" autoplay playsinline class="w-full h-full object-cover">
      Your browser does not support the video tag.
    </video>
    <script>
      const frontVideo = document.getElementById('front-video');
      // Use mobile video if screen is portrait (height > width) or width <= 768
      if (window.innerWidth <= 768 || window.innerHeight > window.innerWidth) {
        frontVideo.src = 'intro-mobile.mp4';
      } else {
        frontVideo.src = 'intro-pc.mp4';
      }
    </script>
  </div>

  <!-- Options Container (Full Screen, Hidden Initially) -->
  <div id="options-container" class="absolute inset-0 bg-black flex flex-col items-center justify-center gap-10 py-8 px-6 z-10 opacity-0 pointer-events-none transition-opacity duration-1000">
    <div class="flex flex-col items-center gap-4 text-center">
      <h1 class="text-6xl font-extrabold tracking-tight bg-clip-text text-transparent bg-btn-gradient drop-shadow-lg">
        Nutrify
      </h1>
      <p class="text-gray-400 text-lg max-w-md leading-relaxed font-light">
        Know what you eat. Track calories, log meals, and consult your smart AI guide.
      </p>
    </div>
    
    <div class="flex flex-col sm:flex-row gap-6 w-full max-w-md">
      <a href="login.html" class="flex-1 py-4 text-center rounded-xl bg-gray-900 text-white font-bold hover:bg-gray-800 transition-colors border border-primary/30 text-lg">Login</a>
      <a href="signup.html" class="flex-1 py-4 text-center rounded-xl bg-btn-gradient text-black font-bold hover:glow-emerald transition-all shadow-[0_0_20px_rgba(0,168,107,0.3)] text-lg">Get Started</a>
    </div>
  </div>

  <script>
    const video = document.getElementById('front-video');
    const videoContainer = document.getElementById('video-container');
    const optionsContainer = document.getElementById('options-container');

    function showOptions() {
      // Fade out video
      videoContainer.style.opacity = '0';
      // Fade in options
      optionsContainer.classList.remove('pointer-events-none');
      optionsContainer.style.opacity = '1';
      optionsContainer.style.zIndex = '30';
      
      setTimeout(() => {
        videoContainer.style.display = 'none';
      }, 1000);
    }

    // When video ends, show options
    video.addEventListener('ended', showOptions);

    // Skip video on click
    document.addEventListener('click', () => {
      if (videoContainer.style.opacity !== '0') {
        showOptions();
      }
    });
  </script>
</body>
</html>

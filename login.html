<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Login - Nutrify</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9ff;
      font-family: 'Hanken Grotesk', sans-serif;
    }
    .ambient-glow {
      background: radial-gradient(circle at 50% -20%, #6bff8f33, transparent 70%);
    }
    .card-shadow {
      box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.04);
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body class="flex min-h-screen flex-col items-center justify-center p-6 ambient-glow">
  <!-- Logo Section -->
  <header class="mb-8 flex flex-col items-center text-center">
    <div class="mb-2 flex h-16 w-16 items-center justify-center rounded-xl bg-[#006e2f] text-white">
      <span class="material-symbols-outlined text-[40px]">nutrition</span>
    </div>
    <h1 class="font-display text-4xl font-extrabold text-[#006e2f]">Nutrify</h1>
    <p class="text-sm text-slate-500 max-w-[280px]">Scientific nutrition for effortless daily control.</p>
  </header>

  <!-- Login Card -->
  <main class="w-full max-w-md rounded-xl bg-white p-8 card-shadow border border-[#E2E8F0]">
    <form id="login-form" class="flex flex-col gap-4">
      <!-- Email Field -->
      <div class="flex flex-col gap-2">
        <label class="text-sm font-semibold text-slate-700" for="email">Email Address</label>
        <div class="relative group">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">mail</span>
          <input class="w-full rounded-lg border border-[#E2E8F0] bg-slate-50 p-3 pl-10 text-sm text-slate-800 focus:border-[#006e2f] focus:ring-2 focus:ring-[#006e2f]/20 outline-none transition-all placeholder:text-slate-400" id="email" placeholder="name@company.com" type="email" required>
        </div>
      </div>
      <!-- Password Field -->
      <div class="flex flex-col gap-2">
        <div class="flex justify-between items-center">
          <label class="text-sm font-semibold text-slate-700" for="password">Password</label>
          <a class="text-xs font-semibold text-[#006e2f] hover:opacity-80 transition-opacity" href="#">Forgot Password?</a>
        </div>
        <div class="relative group">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">lock</span>
          <input class="w-full rounded-lg border border-[#E2E8F0] bg-slate-50 p-3 pl-10 text-sm text-slate-800 focus:border-[#006e2f] focus:ring-2 focus:ring-[#006e2f]/20 outline-none transition-all placeholder:text-slate-400" id="password" placeholder="••••••••" type="password" required>
          <button class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 transition-colors" type="button" onclick="togglePassword()">
            <span id="password-toggle-icon" class="material-symbols-outlined">visibility</span>
          </button>
        </div>
      </div>

      <!-- Login Button -->
      <button class="mt-2 w-full rounded-lg bg-[#006e2f] py-4 font-bold text-white hover:opacity-90 active:scale-95 transition-all" type="submit">
        Login
      </button>

      <!-- Divider -->
      <div class="relative my-2 flex items-center py-2">
        <div class="flex-grow border-t border-[#E2E8F0]"></div>
        <span class="mx-4 flex-shrink text-xs text-slate-400 uppercase tracking-wider">Or continue with</span>
        <div class="flex-grow border-t border-[#E2E8F0]"></div>
      </div>

      <!-- Social Logins -->
      <div class="grid grid-cols-2 gap-4">
        <button class="flex items-center justify-center gap-2 rounded-lg border border-[#E2E8F0] bg-white py-3 text-sm text-slate-700 hover:bg-slate-50 transition-colors active:scale-95" type="button" onclick="handleSocialLogin()">
          <img alt="Google" class="h-5 w-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC5NkwkDWC1aOOJnieMLJ6CmzJniyGcSHTXlmYqOaXuqO-qJLdHSKXAqqwQct32JHce5a-ozb58jNN8OcNkn5TZa7ZIxxAHPSEKHfLWY6C281h5fQLf9gvNuyjXjK5UWJMysVIyUsbE9EujBApFdKCSVK1AemGqHTONjH56z5dZWz6-5mFExHeCJ6hxT1Of84pJBdQdm8IZLdPn1AYvp6dPKJ1BZkGTLuDQpKWU59F3dGfj5q_Y45anGeXJfQ-LwUCfvQr5NdNX">
          Google
        </button>
        <button class="flex items-center justify-center gap-2 rounded-lg border border-[#E2E8F0] bg-white py-3 text-sm text-slate-700 hover:bg-slate-50 transition-colors active:scale-95" type="button" onclick="handleSocialLogin()">
          <span class="material-symbols-outlined text-[20px]">apps</span>
          Apple
        </button>
      </div>
    </form>
  </main>

  <!-- Sign Up Link -->
  <footer class="mt-8 text-center">
    <p class="text-sm text-slate-600">
      New to Nutrify? 
      <a class="font-bold text-[#006e2f] hover:underline transition-all" href="signup.html">Sign Up</a>
    </p>
  </footer>

  <script>
    function togglePassword() {
      const pwInput = document.getElementById('password');
      const icon = document.getElementById('password-toggle-icon');
      if (pwInput.type === 'password') {
        pwInput.type = 'text';
        icon.innerText = 'visibility_off';
      } else {
        pwInput.type = 'password';
        icon.innerText = 'visibility';
      }
    }

    // Handle Login submission
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      
      // Save mock account data
      localStorage.setItem('nutrify_account', JSON.stringify({ email: email, name: email.split('@')[0] }));
      
      // Route appropriately
      proceedAfterAuth();
    });

    function handleSocialLogin() {
      localStorage.setItem('nutrify_account', JSON.stringify({ email: 'social_user@nutrify.com', name: 'Social User' }));
      proceedAfterAuth();
    }

    function proceedAfterAuth() {
      const profile = localStorage.getItem('nutrify_profile');
      if (profile) {
        window.location.replace('dashboard.html');
      } else {
        window.location.replace('onboarding.html');
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Login - Nutrify</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <style>
    }
  </style>
  <link rel="manifest" href="manifest.json">
  <script src="pwa-install.js" defer></script>
</head>
<body class="flex min-h-screen flex-col items-center justify-center p-6 bg-background text-on-background font-display">
  <!-- Logo Section -->
  <header class="mb-8 flex flex-col items-center text-center">
    <div class="mb-2 flex h-16 w-16 items-center justify-center rounded-xl bg-primary text-on-primary">
      <span class="material-symbols-outlined text-[40px]">nutrition</span>
    </div>
    <h1 class="font-display text-4xl font-extrabold text-primary">Nutrify</h1>
    <p class="text-sm text-on-surface-variant max-w-[280px]">Scientific nutrition for effortless daily control.</p>
  </header>

  <!-- Login Card -->
  <main class="w-full max-w-md rounded-[2rem] glass-card-dark p-8 gradient-border border-0 shadow-[0_0_40px_rgba(0,168,107,0.1)]">
    <form id="login-form" class="flex flex-col gap-4">
      <!-- Email Field -->
      <div class="flex flex-col gap-2">
        <label class="text-sm font-semibold text-white" for="email">Email Address</label>
        <div class="relative group">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">mail</span>
          <input class="w-full rounded-xl border border-primary/30 bg-black/50 p-3 pl-10 text-sm text-white focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all placeholder:text-gray-500" id="email" name="email" autocomplete="email" placeholder="name@company.com" type="email" required>
        </div>
      </div>
      <!-- Password Field -->
      <div class="flex flex-col gap-2">
        <div class="flex justify-between items-center">
          <label class="text-sm font-semibold text-white" for="password">Password</label>
          <a class="text-xs font-semibold text-primary hover:text-white transition-colors" href="#">Forgot Password?</a>
        </div>
        <div class="relative group">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">lock</span>
          <input class="w-full rounded-xl border border-primary/30 bg-black/50 p-3 pl-10 text-sm text-white focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all placeholder:text-gray-500" id="password" name="password" autocomplete="current-password" placeholder="••••••••" type="password" required>
          <button class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white transition-colors" type="button" onclick="togglePassword()">
            <span id="password-toggle-icon" class="material-symbols-outlined">visibility</span>
          </button>
        </div>
      </div>

      <!-- Login Button -->
      <button class="mt-2 w-full rounded-xl bg-btn-gradient py-4 font-bold text-black hover:glow-emerald active:scale-95 transition-all" type="submit">
        Login
      </button>

      <!-- Divider -->
      <div class="relative my-2 flex items-center py-2">
        <div class="flex-grow border-t border-outline-variant"></div>
        <span class="mx-4 flex-shrink text-xs text-on-surface-variant uppercase tracking-wider">Or continue with</span>
        <div class="flex-grow border-t border-outline-variant"></div>
      </div>

      <!-- Social Logins -->
      <div class="grid grid-cols-2 gap-4">
        <button class="flex items-center justify-center gap-2 rounded-xl border border-outline-variant bg-surface-variant py-3 text-sm text-on-surface hover:bg-surface-container transition-colors active:scale-95" type="button" onclick="handleSocialLogin('google')">
          <img alt="Google" class="h-5 w-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC5NkwkDWC1aOOJnieMLJ6CmzJniyGcSHTXlmYqOaXuqO-qJLdHSKXAqqwQct32JHce5a-ozb58jNN8OcNkn5TZa7ZIxxAHPSEKHfLWY6C281h5fQLf9gvNuyjXjK5UWJMysVIyUsbE9EujBApFdKCSVK1AemGqHTONjH56z5dZWz6-5mFExHeCJ6hxT1Of84pJBdQdm8IZLdPn1AYvp6dPKJ1BZkGTLuDQpKWU59F3dGfj5q_Y45anGeXJfQ-LwUCfvQr5NdNX">
          Google
        </button>
        <button class="flex items-center justify-center gap-2 rounded-xl border border-outline-variant bg-surface-variant py-3 text-sm text-on-surface hover:bg-surface-container transition-colors active:scale-95" type="button" onclick="handleSocialLogin('apple')">
          <span class="material-symbols-outlined text-[20px]">apps</span>
          Apple
        </button>
      </div>
    </form>
  </main>

  <!-- Sign Up Link -->
  <footer class="mt-8 text-center relative z-10">
    <p class="text-sm text-on-surface-variant">
      New to Nutrify? 
      <a class="font-bold text-primary hover:underline transition-all" href="signup.html">Sign Up</a>
    </p>
  </footer>

  <script>
    function togglePassword() {
      const pwInput = document.getElementById('password');
      const icon = document.getElementById('password-toggle-icon');
      if (pwInput.type === 'password') {
        pwInput.type = 'text';
        icon.innerText = 'visibility_off';
      } else {
        pwInput.type = 'password';
        icon.innerText = 'visibility';
      }
    }

    // Handle Login submission
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      
      if (window.isDisposableEmail && window.isDisposableEmail(email)) {
        alert("Temporary or disposable email addresses are not allowed. Please use a real email address.");
        return;
      }

      const password = document.getElementById('password').value;
      
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const originalText = submitBtn.innerText;
      submitBtn.innerText = 'Logging in...';
      submitBtn.disabled = true;

      const { data, error } = await window.supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      submitBtn.innerText = originalText;
      submitBtn.disabled = false;

      if (error) {
        if (error.message.toLowerCase().includes('rate limit') || error.message.toLowerCase().includes('exceed')) {
          console.warn("Rate limit detected: Bypassing auth for Developer Offline Mode.");
          localStorage.setItem('nutrify_account', JSON.stringify({ email: email, name: email.split('@')[0] }));
          if (window.thawAccount) window.thawAccount(email);
          proceedAfterAuth();
        } else if (confirm("Supabase Error: " + error.message + "\n\nWould you like to bypass authentication and enter Developer Offline Mode to test the UI?")) {
          localStorage.setItem('nutrify_account', JSON.stringify({ email: email, name: email.split('@')[0] }));
          if (window.thawAccount) window.thawAccount(email);
          proceedAfterAuth();
        }
      } else {
        localStorage.setItem('nutrify_account', JSON.stringify({ email: data.user.email, name: data.user.user_metadata?.full_name }));
        
        // Thaw local data first if available, then sync with cloud
        if (window.thawAccount) window.thawAccount(data.user.email);
        
        submitBtn.innerText = 'Syncing Profile...';
        await window.syncWithCloud();
        
        proceedAfterAuth();
      }
    });

    async function handleSocialLogin(provider) {
      const { data, error } = await window.supabaseClient.auth.signInWithOAuth({
        provider: provider,
        options: {
          redirectTo: window.location.origin + '/dashboard.html'
        }
      });
      if (error) {
        console.error("OAuth error:", error.message);
        alert("Failed to login with " + provider + ": " + error.message);
      }
    }

    function proceedAfterAuth() {
      const profile = localStorage.getItem('nutrify_profile');
      if (profile) {
        window.location.replace('dashboard.html');
      } else {
        window.location.replace('onboarding.html');
      }
    }
  </script>
</body>
</html>
